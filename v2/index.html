.offline-banner{max-width:1180px;margin:16px auto 0;padding:14px 22px;background:#e8edfc;border-radius:12px;color:#354263;font:13px/1.7 system-ui,sans-serif;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}.offline-banner strong{margin-right:12px;color:#263dd1}.offline-actions{display:flex;gap:10px}.offline-actions button{min-height:44px;border:1px solid #b9c6ec;background:#fff;border-radius:7px;padding:6px 12px;cursor:pointer}.offline-banner p{width:100%;margin:0}@media(max-width:600px){.offline-banner{margin:10px 16px 0;padding:12px 14px}.offline-banner span{display:block;margin-top:3px}}</style><style data-scratchpad-style>
/* 样式仅作用于纸笔练习新增的草稿区域。 */
.scratchpad-panel{border:1px solid #dce3f2;border-radius:20px;background:#fff;padding:24px;margin-top:22px;min-width:0;box-shadow:0 8px 30px #18244204;color:#17233d}
.scratchpad-heading{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:18px}
.scratchpad-heading h2{font-size:20px;font-weight:700;margin:0;line-height:1.4}
.scratchpad-heading p{color:#76829b;font-size:13px;margin:4px 0 0}
.scratchpad-panel button,.scratchpad-panel select{font:inherit;font-size:13px;min-height:42px;border:1px solid #dce3f2;border-radius:9px;background:#fff;color:#243654;padding:8px 12px;cursor:pointer;white-space:nowrap;touch-action:manipulation}
.scratchpad-panel button:disabled{opacity:.4;cursor:default}
.scratchpad-panel button[aria-pressed=true]{background:#edf0ff;border-color:#6676e9;color:#263dd1;font-weight:600}
.scratchpad-panel button:focus-visible,.scratchpad-panel select:focus-visible,.scratchpad-panel input:focus-visible{outline:3px solid #7b89f2;outline-offset:2px}
.scratchpad-toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.scratchpad-transport{display:flex;align-items:center;flex-wrap:wrap;gap:8px;position:sticky;top:0;z-index:2;background:#fff;padding:8px 0 14px;margin-bottom:8px;border-bottom:1px solid #edf0f7}
.scratchpad-progress{font-size:13px;color:#67738b;margin-right:auto}
.scratchpad-transport [data-action=playback]{background:#263dd1;border-color:#263dd1;color:#fff}
.scratchpad-width{display:flex;align-items:center;gap:6px;font-size:13px;color:#67738b}
.scratchpad-width select{padding-right:6px}
.scratchpad-pen-only{display:flex;align-items:center;flex-wrap:wrap;gap:7px;font-size:13px;margin:14px 0;min-height:30px;cursor:pointer}
.scratchpad-pen-only input{width:18px;height:18px;accent-color:#263dd1}
.scratchpad-pen-only span{color:#8590a6;font-size:12px}
.scratchpad-paper{overflow:hidden;border:1px solid #dce3f2;border-radius:12px;background:repeating-linear-gradient(to bottom,#fff 0%,#fff calc(10% - 1px),#e6ebf6 calc(10% - 1px),#e6ebf6 10%);line-height:0}
.scratchpad-paper canvas{display:block;width:100%;height:auto;aspect-ratio:10/7;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:crosshair}
.scratchpad-paper canvas.scratchpad-erasing{cursor:cell}
.scratchpad-pages{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:14px}
.scratchpad-page-number{font-size:13px;color:#6c7892;white-space:nowrap;padding:0 3px}
.scratchpad-pages [data-action=save]{color:#263dd1;margin-left:auto}
.scratchpad-status{display:block;color:#566782;font-size:12px;line-height:1.7;margin-top:10px;overflow-wrap:anywhere}
.scratchpad-status:empty{display:none}
.scratchpad-note{font-size:12px;line-height:1.8;color:#8390a8;margin:12px 0 0}
.scratchpad-body[hidden]{display:none}
@media(min-width:1000px){
  .session-area.scratch-enabled{max-width:1250px;display:grid;grid-template-columns:minmax(280px,.72fr) minmax(0,1.28fr);gap:22px;align-items:start}
  .scratch-enabled>.session-heading{grid-column:1/-1;margin-bottom:4px}
  .scratch-enabled>.session-card,.scratch-enabled>.result-card{grid-column:1;padding:25px 22px;min-width:0}
  .scratch-enabled>.scratchpad-panel{grid-column:2;margin-top:0;position:sticky;top:18px}
  .scratchpad-transport{display:none}
  .scratch-enabled .listening-disc{margin:24px auto 18px;width:86px;height:86px}
  .scratch-enabled .listen-title{font-size:20px}
  .scratch-enabled .session-actions{flex-wrap:wrap}
}
@media(max-width:600px){
  .scratchpad-panel{padding:18px 14px;border-radius:16px}
  .scratchpad-panel button,.scratchpad-panel select{min-height:44px;padding:8px 10px}
  .scratchpad-toolbar{gap:6px}
  .scratchpad-pages{gap:6px}
  .scratchpad-pages [data-action=save]{margin-left:0}
  .scratchpad-heading h2{font-size:18px}
}

</script><script data-scratchpad-script>
/* 本轮草稿独立于听写、语音和词库。原始应用不需要修改。 */
(() => {
  'use strict';
  const WIDTH = 1000;
  const HEIGHT = 700;
  const MAX_PAGES = 30;
  let active = null;

  function createScratchpad(session) {
    const panel = document.createElement('section');
    panel.className = 'scratchpad-panel';
    panel.setAttribute('aria-label', '本轮听写草稿纸');
    panel.innerHTML = `
      <div class="scratchpad-heading">
        <div><h2>本轮草稿</h2><p>听到后，直接在这里写</p></div>
        <button type="button" data-action="fold" aria-expanded="true">收起草稿</button>
      </div>
      <div class="scratchpad-body">
        <div class="scratchpad-transport" role="group" aria-label="草稿区播放控制">
          <span class="scratchpad-progress"></span>
          <button type="button" data-action="playback">开始播放</button>
          <button type="button" data-action="relisten" aria-label="草稿区重听当前词">重听</button>
        </div>
        <div class="scratchpad-toolbar" role="group" aria-label="书写工具">
          <button type="button" data-action="pen" aria-pressed="true">写字</button>
          <button type="button" data-action="eraser" aria-pressed="false">橡皮</button>
          <label class="scratchpad-width">笔粗
            <select aria-label="笔画粗细"><option value="3">细</option><option value="5" selected>中</option><option value="8">粗</option></select>
          </label>
          <button type="button" data-action="undo" disabled>撤销</button>
          <button type="button" data-action="redo" disabled>重做</button>
          <button type="button" data-action="clear" disabled>清空本页</button>
        </div>
        <label class="scratchpad-pen-only"><input type="checkbox">仅手写笔 <span>防止手掌留下笔迹</span></label>
        <div class="scratchpad-paper">
          <canvas role="img" aria-label="草稿书写区域，可用手指、手写笔或鼠标书写"></canvas>
        </div>
        <div class="scratchpad-pages" role="group" aria-label="草稿翻页">
          <button type="button" data-action="previous" aria-label="上一页草稿" disabled>上一页</button>
          <span class="scratchpad-page-number">第 1 / 1 页</span>
          <button type="button" data-action="next" aria-label="下一页草稿" disabled>下一页</button>
          <button type="button" data-action="add">加一页</button>
          <button type="button" data-action="save">保存本页图片</button>
        </div>
        <output class="scratchpad-status" aria-live="polite"></output>
        <p class="scratchpad-note">切词、暂停和核对答案会保留草稿。离开本轮或再练时清空，请先保存图片。草稿不会自动识别或判分。</p>

    session.classList.add('scratch-enabled');

    const canvas = panel.querySelector('canvas');

    const committed = document.createElement('canvas');
    const committedContext = committed.getContext('2d');
    const body = panel.querySelector('.scratchpad-body');
    const status = panel.querySelector('.scratchpad-status');
    const penOnly = panel.querySelector('input');
    const widthSelect = panel.querySelector('select');
    const button = name => panel.querySelector(`[data-action="${name}"]`);
    const pages = [{ strokes: [], redo: [] }];
    let pageIndex = 0;
    let mode = 'pen';
    let currentStroke = null;

      const progress = session.querySelector('.progress-label > span');
      const label = progress ? progress.textContent.replace(/\s+/g, ' ').trim() : '本轮完成，可核对答案';
      const progressElement = panel.querySelector('.scratchpad-progress');
      if (progressElement.textContent !== label) progressElement.textContent = label;
      const playLabel = controls[0] ? controls[0].textContent.trim() : '本轮完成';

      button('redo').disabled = !page().redo.length;

      const w = Math.max(1, Math.round(rect.width * dpr));
      const h = Math.max(1, Math.round(rect.height * dpr));
      if (canvas.width !== w || canvas.height !== h) {
        finishStroke();
        canvas.width = w;
        canvas.height = h;
        committedDirty = true;
        redraw();
      }
    }

    function point(event) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: Math.max(0, Math.min(WIDTH, (event.clientX - rect.left) / rect.width * WIDTH)),
        y: Math.max(0, Math.min(HEIGHT, (event.clientY - rect.top) / rect.height * HEIGHT)),
        pressure: Number.isFinite(event.pressure) && event.pressure > 0 ? event.pressure : 0.5
      };
    }

    function addPoint(event) {
      const p = point(event);
      const last = currentStroke.points[currentStroke.points.length - 1];
      if (!last || Math.abs(last.x - p.x) + Math.abs(last.y - p.y) > 0.2) currentStroke.points.push(p);
    }

    function finishStroke() {
      const captured = pointerId;
      pointerId = null;
      pointerKind = null;
      if (currentStroke) {
        page().strokes.push(currentStroke);
        page().redo = [];
        currentStroke = null;
        committedDirty = true;
        updateTools();
        scheduleDraw();
      }
      if (captured !== null && canvas.hasPointerCapture(captured)) canvas.releasePointerCapture(captured);
    }

    listen(canvas, 'pointerdown', event => {
      if (event.pointerType === 'mouse' && event.button !== 0) return;
      if (penOnly.checked && event.pointerType === 'touch') return;
      // 笔优先；一个 pointerId 对应一条笔画，忽略另一只手指和掌触。
      if (pointerId !== null) {
        if (event.pointerType === 'pen' && pointerKind === 'touch') finishStroke();
        else return;
      }
      if (event.pointerType === 'touch' && !event.isPrimary) return;
      event.preventDefault();
      pointerId = event.pointerId;
      pointerKind = event.pointerType;
      currentStroke = { mode, width: mode === 'eraser' ? 30 : Number(widthSelect.value), pressure: event.pointerType === 'pen' && mode === 'pen', points: [] };
      addPoint(event);
      try { canvas.setPointerCapture(pointerId); } catch (_) { /* 合成事件或设备不支持 capture */ }
      scheduleDraw();
    }, { passive: false });

    listen(canvas, 'pointermove', event => {
      if (event.pointerId !== pointerId || !currentStroke) return;
      event.preventDefault();
      const samples = event.getCoalescedEvents ? event.getCoalescedEvents() : [];
      (samples.length ? samples : [event]).forEach(addPoint);
      scheduleDraw();
    }, { passive: false });
    const end = event => {
      if (event.pointerId !== pointerId) return;
      if (event.type === 'pointerup' && currentStroke) addPoint(event);
      finishStroke();
    };
    listen(canvas, 'pointerup', end);
    listen(canvas, 'pointercancel', end);
    listen(canvas, 'lostpointercapture', end);
    listen(document, 'visibilitychange', () => { if (document.hidden) finishStroke(); });
    listen(window, 'blur', finishStroke);
    listen(penOnly, 'change', () => {
      finishStroke();
      say(penOnly.checked ? '仅手写笔：手指仍可操作按钮和滚动页面。' : '可以用手指、手写笔或鼠标书写。');
    });

    function saveImage() {
      finishStroke();
      const exportPage = pageIndex + 1;
      const output = document.createElement('canvas');
      output.width = WIDTH * 2;
      output.height = HEIGHT * 2;
      const out = output.getContext('2d');
      out.scale(2, 2);
      out.fillStyle = '#ffffff';
      out.fillRect(0, 0, WIDTH, HEIGHT);
      out.strokeStyle = '#e6ebf6';
      out.lineWidth = 1;
      for (let y = 70; y < HEIGHT; y += 70) {
        out.beginPath(); out.moveTo(0, y); out.lineTo(WIDTH, y); out.stroke();
      }
      // 先在透明墨迹层擦除，再合成白纸，保证橡皮不会擦掉背景横线。
      const ink = document.createElement('canvas');
      ink.width = WIDTH * 2; ink.height = HEIGHT * 2;
      const inkContext = ink.getContext('2d');
      inkContext.scale(2, 2);
      page().strokes.forEach(stroke => drawStroke(inkContext, stroke));
      out.drawImage(ink, 0, 0, WIDTH, HEIGHT);
      output.toBlob(blob => {
        if (closed) return;
        if (!blob) { say('图片生成失败，请再试一次。'); return; }
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = `听写草稿-第${exportPage}页-${new Date().toISOString().replace(/[:.]/g, '-')}.png`;
        link.click();
        setTimeout(() => URL.revokeObjectURL(url), 60000);
        say('已生成本页图片。iPad 可在 Safari 下载中打开，再存储到“照片”或“文件”。');
      }, 'image/png');
    }

    listen(panel, 'click', event => {
      const target = event.target.closest('button[data-action]');
      if (!target || target.disabled) return;
      const action = target.dataset.action;
      finishStroke();
      if (action === 'playback' || action === 'relisten') {
        const controls = session.querySelectorAll('.session-card .session-actions button');
        const control = controls[action === 'playback' ? 0 : 1];
        if (control && !control.disabled) control.click();
        return;
      }
      if (action === 'pen' || action === 'eraser') mode = action;
      if (action === 'undo') {
        const stroke = page().strokes.pop();
        if (stroke) page().redo.push(stroke);
      }
      if (action === 'redo') {
        const stroke = page().redo.pop();
        if (stroke) page().strokes.push(stroke);
      }
      if (action === 'clear') {
        if (!window.confirm('清空这一页草稿？其他页会保留。')) return;
        page().strokes = []; page().redo = []; say('本页已清空。');
      }
      if (action === 'previous' || action === 'next') pageIndex += action === 'previous' ? -1 : 1;
      if (action === 'add') {
        pages.push({ strokes: [], redo: [] }); pageIndex = pages.length - 1;
        say(pages.length === MAX_PAGES ? '本轮最多 30 页，请保存图片后开启新一轮。' : '已增加一页空白草稿。');
      }
      if (action === 'fold') {
        body.hidden = !body.hidden;
        target.setAttribute('aria-expanded', String(!body.hidden));
        target.textContent = body.hidden ? '展开草稿' : '收起草稿';
        if (!body.hidden) resize();
      }
      if (action === 'save') saveImage();
      committedDirty = true;
      updateTools();
      scheduleDraw();
    });
    listen(window, 'resize', resize);
    const observer = typeof ResizeObserver === 'function' ? new ResizeObserver(resize) : null;
    if (observer) observer.observe(canvas);
    resize();
    return {
      session, panel, refreshPractice,
      destroy() {
        finishStroke(); closed = true;
        if (drawFrame) cancelAnimationFrame(drawFrame);
        if (observer) observer.disconnect();
        disposers.forEach(dispose => dispose());
        panel.remove(); session.classList.remove('scratch-enabled');
      }
    };
  }

  function sync() {
    const session = document.querySelector('.session-area');
    const paper = session && session.querySelector('.session-heading .eyebrow')?.textContent.trim() === 'PAPER & PEN';
    if (active && (active.session !== session || !paper)) { active.destroy(); active = null; }
    if (paper && !active) active = createScratchpad(session);
    // React 切换核对视图时可能移动子节点；同一轮使用同一个草稿容器。
    if (active && active.panel.parentNode !== session) session.appendChild(active.panel);
    if (active) active.refreshPractice();
  }
  const start = () => {
    const root = document.getElementById('root');
    if (!root) return;
    new MutationObserver(sync).observe(root, { childList: true, subtree: true, characterData: true });
    sync();
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start, { once: true });
  else start();
})();

</script>
</body></html>
